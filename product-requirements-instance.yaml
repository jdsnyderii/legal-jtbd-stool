requirements:
- id: req:REQ-EDISC-COST-CONTROL
  pref_label: Support cost-aware discovery workflows
  description: 'The system shall allow teams to set budgets, track spend, and receive alerts when discovery activities approach
    or exceed thresholds.

    '
  requirement_type: functional
  realizes_product_outcomes:
  - inv:POUT-LOWER-DISCOVERY-COST
  priority: must
  acceptance_criteria:
  - Users can define per-matter or per-stage discovery budgets
  - Real-time or daily spend visibility is available
  - Configurable alerts fire at 50%, 80%, and 100% of budget
  status: active
  version: '1.0'
  satisfied_by_capabilities:
  - req:CAP-BUDGET-TRACKING
  - req:CAP-DISCOVERY-WORKFLOW
- id: req:REQ-PRIVILEGE-PROTECTION
  pref_label: Protect privileged material throughout discovery
  description: 'The system shall support identification, logging, and claw-back of privileged documents with audit trail.

    '
  requirement_type: functional
  realizes_product_outcomes:
  - inv:POUT-REDUCE-SANCTIONS
  priority: must
  acceptance_criteria:
  - Privilege log can be generated and maintained
  - Claw-back workflow is supported
  - Full audit trail of privilege decisions exists
  status: active
  version: '1.0'
  satisfied_by_capabilities:
  - req:CAP-PRIVILEGE-LOG
  - req:CAP-DISCOVERY-WORKFLOW
- id: req:REQ-EARLY-CASE-ASSESSMENT
  pref_label: Support structured early case assessment
  description: 'The system shall guide users through a structured assessment of merits, exposure, and early resolution options.

    '
  requirement_type: functional
  realizes_product_outcomes:
  - inv:POUT-IMPROVE-OUTCOME-PREDICTABILITY
  - inv:POUT-FASTER-CYCLE-TIME
  priority: should
  acceptance_criteria:
  - Standardized assessment questionnaire is available
  - Assessment results are stored and comparable across matters
  - Links to similar historical matters are suggested
  status: active
  version: '1.0'
  satisfied_by_capabilities:
  - req:CAP-CASE-ASSESSMENT
  - req:CAP-ANALYTICS-ENGINE
- id: req:REQ-CLIENT-STATUS-DASHBOARD
  pref_label: Provide client-facing matter status dashboard
  description: 'Clients shall have a secure view of current phase, key milestones, open tasks, and upcoming dates.

    '
  requirement_type: functional
  realizes_product_outcomes:
  - inv:POUT-IMPROVE-STATUS-VISIBILITY
  priority: should
  acceptance_criteria:
  - Dashboard shows current phase and next milestone
  - Open action items and owners are visible
  - Data is near real-time (max 24h lag)
  status: active
  version: '1.0'
  satisfied_by_capabilities:
  - req:CAP-STATUS-DASHBOARD
- id: req:REQ-SALI-TAGGING
  pref_label: Support consistent SALI LMSS tagging of matters
  description: 'Matters shall be taggable with SALI-compatible codes for area of law, phase, services, and other attributes
    to enable analytics.

    '
  requirement_type: data
  realizes_product_outcomes:
  - inv:POUT-BETTER-PORTFOLIO-INSIGHT
  priority: must
  acceptance_criteria:
  - Users can apply and edit SALI-style tags
  - Tags are queryable and exportable
  - Tagging completeness is measurable
  status: active
  version: '1.0'
  satisfied_by_capabilities:
  - req:CAP-TAGGING-SERVICE
  - req:CAP-ANALYTICS-ENGINE
