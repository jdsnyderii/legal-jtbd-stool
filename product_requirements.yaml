id: https://example.org/legal-jtbd/product-requirements
name: LegalJTBDProductRequirements
version: 0.4.0
prefixes:
  req: https://example.org/legal-jtbd/product-requirements/
  inv: https://example.org/legal-jtbd/investments/
  jtbd: https://example.org/legal-jtbd/jobs/
  gf: https://example.org/legal-jtbd/graph-foundation/
default_prefix: req
imports:
  - linkml:types
  - gf:graph_foundation
classes:
  Requirement:
    is_a: GraphNode
    slots: [requirement_type, realizes_product_outcomes, satisfied_by_capabilities, priority, acceptance_criteria]
  Capability:
    is_a: GraphNode
    slots: [capability_type, satisfies_requirements, supports_jobs, supports_desired_outcomes, implementation_status, owner]
slots:
  requirement_type: {range: RequirementType}
  realizes_product_outcomes: {range: ProductOutcome, multivalued: true}
  satisfied_by_capabilities: {range: Capability, multivalued: true}
  priority: {range: PriorityLevel}
  acceptance_criteria: {range: string, multivalued: true}
  capability_type: {range: CapabilityType}
  satisfies_requirements: {range: Requirement, multivalued: true}
  supports_jobs: {range: Job, multivalued: true}
  supports_desired_outcomes: {range: DesiredOutcome, multivalued: true}
  implementation_status: {range: ImplementationStatus}
  owner: {range: string}
enums:
  RequirementType:
    permissible_values: {functional: {}, non_functional: {}, constraint: {}, business_rule: {}, data: {}, interface: {}}
  CapabilityType:
    permissible_values: {core: {}, supporting: {}, enabling: {}, partner: {}, commodity: {}}
  PriorityLevel:
    permissible_values: {must: {}, should: {}, could: {}, wont: {}}
  ImplementationStatus:
    permissible_values: {idea: {}, planned: {}, in_progress: {}, delivered: {}, deprecated: {}}
