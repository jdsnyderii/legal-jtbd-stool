slots:
  sali_tags:
    name: sali_tags
    annotations:
      primary_key:
        tag: primary_key
        value: 'true'
    description: External SALI LMSS concept CURIEs (not in-schema classes). Stored
      as TEXT in SQL.
    from_schema: https://example.org/legal-jtbd/unified_relational
