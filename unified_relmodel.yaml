      id:
        name: id
        annotations:
          primary_key:
            tag: primary_key
            value: 'true'
          required:
            tag: required
            value: 'true'
        description: Canonical, storage-independent identifier.
        from_schema: https://example.org/legal-jtbd/unified_relational
        identifier: true
        owner: Identifiable
        domain_of:
        - Identifiable
        - GraphNode
        - GraphEdge
        - Job
        - DesiredOutcome
        - InvestmentLane
        - ProductOutcome
        - Requirement
        - Capability
        range: SemanticId
        required: true
      pref_label:
        name: pref_label
        description: Human-readable preferred label.
        from_schema: https://example.org/legal-jtbd/unified_relational
        owner: Identifiable
        domain_of:
        - Identifiable
        range: string
      description:
        name: description
        from_schema: https://example.org/legal-jtbd/unified_relational
        owner: Identifiable
        domain_of:
        - Identifiable
        - GraphNode
        - GraphEdge
        - Job
        - DesiredOutcome
        - InvestmentLane
        - ProductOutcome
        - Requirement
        - Capability
        range: string
      status:
        name: status
        annotations:
          required:
            tag: required
            value: 'true'
        from_schema: https://example.org/legal-jtbd/unified_relational
        owner: Identifiable
        domain_of:
        - Identifiable
        range: LifecycleStatus
        required: true
      version:
        name: version
        from_schema: https://example.org/legal-jtbd/unified_relational
        owner: Identifiable
        domain_of:
        - Identifiable
        range: string
    class_uri: jtbd:Identifiable
