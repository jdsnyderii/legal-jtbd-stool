    name: Job
    description: 'A job to be done at one of three Kalbach-aligned levels: top_level
      (Main Job), mid_level (stage in the job map), or micro (micro-job inside a stage).

      '
    from_schema: https://example.org/legal-jtbd/unified_relational
    is_a: GraphNode
    attributes:
      job_level:
        name: job_level
        annotations:
