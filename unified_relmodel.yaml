        text: explore
  RequirementType:
    name: RequirementType
    from_schema: https://example.org/legal-jtbd/unified_relational
    permissible_values:
      functional:
        text: functional
      non_functional:
        text: non_functional
      constraint:
        text: constraint
      business_rule:
        text: business_rule
      data:
        text: data
      interface:
        text: interface
  CapabilityType:
    name: CapabilityType
    from_schema: https://example.org/legal-jtbd/unified_relational
    permissible_values:
      core:
        text: core
      supporting:
        text: supporting
      enabling:
        text: enabling
      partner:
        text: partner
      commodity:
        text: commodity
  PriorityLevel:
    name: PriorityLevel
    from_schema: https://example.org/legal-jtbd/unified_relational
    permissible_values:
      must:
        text: must
      should:
        text: should
      could:
        text: could
      wont:
        text: wont
  ImplementationStatus:
    name: ImplementationStatus
    from_schema: https://example.org/legal-jtbd/unified_relational
    permissible_values:
      idea:
        text: idea
      planned:
        text: planned
      in_progress:
        text: in_progress
      delivered:
        text: delivered
      deprecated:
