id: https://example.org/legal-jtbd/investments
name: LegalJTBDInvestments
title: Investment Lanes and Product Outcomes
version: 0.4.0
description: 'Strategic investment lanes and the measurable product outcomes that live inside them. Product
  Outcomes link back to Desired Outcomes from the Jobs model.

  '
prefixes:
  linkml: https://w3id.org/linkml/
  inv: https://example.org/legal-jtbd/investments/
  gf: https://example.org/legal-jtbd/graph-foundation/
  jtbd: https://example.org/legal-jtbd/jobs/
default_prefix: inv
imports:
- linkml:types
- gf:graph_foundation
- jtbd:jobs
classes:
  InvestmentLane:
    is_a: GraphNode
    annotations:
      graph_role: node
    slots:
    - horizon
    - strategic_weight
    - product_outcomes
    - owner
    slot_usage:
      id:
        pattern: ^inv:LANE-[A-Z0-9-]+$
  ProductOutcome:
    is_a: GraphNode
    annotations:
      graph_role: node
    slots:
    - lane
    - informed_by_outcomes
    - target_metric
    - target_value
    - current_value
    - target_date
    slot_usage:
      id:
        pattern: ^inv:POUT-[A-Z0-9-]+$
      lane:
        required: true
slots:
  strategic_weight:
    range: float
    description: Relative strategic importance of the lane (e.g. 0.0–1.0).
  product_outcomes:
    range: ProductOutcome
    multivalued: true
    annotations:
      graph_role: edge
  owner:
    range: string
  lane:
    range: InvestmentLane
    annotations:
      graph_role: edge
  informed_by_outcomes:
    range: DesiredOutcome
    multivalued: true
    description: Kalbach desired outcomes this product outcome is designed to improve.
  target_metric:
    range: string
  target_value:
    range: string
  current_value:
    range: string
  target_date:
    range: date
  horizon:
    range: InvestmentHorizon
    description: Now / next / later / explore planning horizon.
enums:
  InvestmentHorizon:
    permissible_values:
      now: {}
      next: {}
      later: {}
      explore: {}
