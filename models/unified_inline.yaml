id: https://example.org/legal-jtbd/unified
name: LegalJTBDUnified
version: 0.5.0
prefixes:
  linkml: https://w3id.org/linkml/
  jtbd: https://example.org/legal-jtbd/jobs/
  gf: https://example.org/legal-jtbd/graph-foundation/
  skos: http://www.w3.org/2004/02/skos/core#
  sali: https://sali.org/lmss/
  inv: https://example.org/legal-jtbd/investments/
  req: https://example.org/legal-jtbd/product-requirements/
default_prefix: jtbd
imports:
- linkml:types
types:
  SemanticId:
    typeof: string
    description: CURIE/IRI semantic id
enums:
  LifecycleStatus:
    permissible_values:
      draft: null
      active: null
      deprecated: null
      archived: null
  JobLevel:
    permissible_values:
      top_level:
        description: Main Job — broad, stable objective the performer is trying to achieve.
      mid_level:
        description: Stage / major step in the job map (often aligned to a litigation phase).
      micro:
        description: Micro-job — smallest actionable objective inside a mid_level stage.
  LitigationPhase:
    permissible_values:
      pre_litigation: Pre-litigation / Investigation & Assessment
      pleadings: Pleadings / Case Initiation
      discovery: Discovery
      pretrial: Pretrial / Motions & Case Management
      trial: Trial / Hearing
      post_trial: Post-trial / Appeal / Enforcement
      resolution: Resolution / Settlement / Closure
      cross_cutting: Cross-cutting (applies to multiple phases)
  OutcomeDirection:
    permissible_values:
      minimize: null
      maximize: null
      increase: null
      decrease: null
      reduce: null
      raise: null
  InvestmentHorizon:
    permissible_values:
      now: {}
      next: {}
      later: {}
      explore: {}
  RequirementType:
    permissible_values:
      functional: null
      non_functional: null
      constraint: null
      business_rule: null
      data: null
      interface: null
  CapabilityType:
    permissible_values:
      core: null
      supporting: null
      enabling: null
      partner: null
      commodity: null
  PriorityLevel:
    permissible_values:
      must: null
      should: null
      could: null
      wont: null
  ImplementationStatus:
    permissible_values:
      idea: null
      planned: null
      in_progress: null
      delivered: null
      deprecated: null
slots:
  id:
    identifier: true
    range: SemanticId
    description: Canonical, storage-independent identifier.
  pref_label:
    range: string
    description: Human-readable preferred label.
  description:
    range: string
  status:
    range: LifecycleStatus
    required: true
  version:
    range: string
  job_level:
    range: JobLevel
    required: true
    description: 'top_level = Main Job; mid_level = stage / major step in the job map; micro = micro-job
      (finest grain inside a stage).

      '
  parent_job:
    range: Job
    description: 'Hierarchical parent. A mid_level job points to a top_level job. A micro job points to
      a mid_level (or occasionally top_level) job.

      '
  child_jobs:
    range: Job
    multivalued: true
    description: 'Convenience inverse of parent_job. Especially useful for listing the micro-jobs that
      belong to a mid_level stage.

      '
  phase:
    range: LitigationPhase
    description: Coarse-grained litigation phase this job primarily belongs to.
  sali_tags:
    range: uriorcurie
    multivalued: true
    description: External SALI LMSS concept CURIEs (not in-schema classes). Stored as TEXT in SQL.
  desired_outcomes:
    range: DesiredOutcome
    multivalued: true
  related_jobs:
    range: Job
    multivalued: true
    description: Lateral (non-hierarchical) relationships between jobs.
  sequence_order:
    range: integer
    description: 'Optional ordering within a parent (especially useful for micro-jobs that form a sequence
      inside a mid_level stage).

      '
  iterative:
    range: boolean
    description: 'True when this mid-level job can legitimately repeat / loop during a matter (e.g. discovery
      waves, successive motions, negotiation rounds).

      '
  statement:
    range: string
    description: Full Kalbach statement.
  direction:
    range: OutcomeDirection
  unit_of_measure:
    range: string
  qualifier:
    range: string
  importance:
    range: integer
    minimum_value: 1
    maximum_value: 10
  satisfaction:
    range: integer
    minimum_value: 1
    maximum_value: 10
  opportunity_score:
    range: float
  related_job:
    range: Job
  last_reviewed:
    range: date
  statement_verb:
    range: string
    description: 'Kalbach job statement: action verb (solution-agnostic).'
  statement_object:
    range: string
    description: 'Kalbach job statement: object of the verb.'
  statement_clarifier:
    range: string
    description: 'Kalbach job statement: optional contextual clarifier.'
  job_statement:
    range: string
    description: Assembled or free-text job statement (verb + object + clarifier).
  job_performer:
    range: string
    description: Who executes the job (end user / job performer).
  buyer_role:
    range: string
    description: Who buys or authorizes when different from the job performer.
  circumstance_situation:
    range: string
    description: Triggering situation / context in which the job arises.
  circumstance_constraints:
    range: string
    multivalued: true
    description: Constraints framing the job (time, budget, risk, forum, etc.).
  emotional_job:
    range: string
    description: How the performer wants to feel while or after doing the job.
  social_job:
    range: string
    description: How the performer wants to be perceived socially in relation to the job.
  end_state:
    range: string
    description: What 'done' looks like — clear completion criterion for the job.
  job_story_situation:
    range: string
    description: 'Job story: When [situation]…'
  job_story_motivation:
    range: string
    description: 'Job story: I want to [motivation]…'
  job_story_expected_outcome:
    range: string
    description: 'Job story: so I can [expected outcome].'
  object_of_control:
    range: string
    description: 'ODI/Kalbach desired outcome: object of control being improved.'
  strategic_weight:
    range: float
    description: Relative strategic importance of the lane (e.g. 0.0–1.0).
  product_outcomes:
    range: ProductOutcome
    multivalued: true
  owner:
    range: string
  lane:
    range: InvestmentLane
  informed_by_outcomes:
    range: DesiredOutcome
    multivalued: true
    description: Kalbach desired outcomes this product outcome is designed to improve.
  target_metric:
    range: string
  target_value:
    range: string
  current_value:
    range: string
  target_date:
    range: date
  horizon:
    range: InvestmentHorizon
    description: Now / next / later / explore planning horizon.
  requirement_type:
    range: RequirementType
  realizes_product_outcomes:
    range: ProductOutcome
    multivalued: true
    description: Product outcomes this requirement helps realize.
  satisfied_by_capabilities:
    range: Capability
    multivalued: true
  priority:
    range: PriorityLevel
  acceptance_criteria:
    range: string
    multivalued: true
  capability_type:
    range: CapabilityType
  satisfies_requirements:
    range: Requirement
    multivalued: true
    description: Requirements this capability satisfies.
  supports_jobs:
    range: Job
    multivalued: true
    description: Jobs (any level) this capability supports.
  supports_desired_outcomes:
    range: DesiredOutcome
    multivalued: true
    description: Desired outcomes this capability supports.
  implementation_status:
    range: ImplementationStatus
classes:
  Identifiable:
    abstract: true
    description: Any element that has a stable semantic identity.
    slots:
    - id
    - pref_label
    - description
    - status
    - version
    slot_usage:
      id:
        identifier: true
        required: true
        range: SemanticId
  GraphNode:
    abstract: true
    is_a: Identifiable
    description: Domain entity that should be treated as a graph node.
  GraphEdge:
    abstract: true
    is_a: Identifiable
    description: 'First-class relationship that itself carries identity and attributes. Use when the edge
      needs its own metadata.

      '
  Job:
    is_a: GraphNode
    description: 'A job to be done at one of three Kalbach-aligned levels: top_level (Main Job), mid_level
      (stage in the job map), or micro (micro-job inside a stage).

      '
    slots:
    - job_level
    - parent_job
    - phase
    - sali_tags
    - desired_outcomes
    - child_jobs
    - related_jobs
    - last_reviewed
    - sequence_order
    - iterative
    - job_statement
    - statement_verb
    - statement_object
    - statement_clarifier
    - job_performer
    - buyer_role
    - circumstance_situation
    - circumstance_constraints
    - emotional_job
    - social_job
    - end_state
    - job_story_situation
    - job_story_motivation
    - job_story_expected_outcome
    slot_usage:
      id:
        pattern: ^jtbd:JOB-[A-Z0-9-]+$
      job_level:
        required: true
  DesiredOutcome:
    is_a: GraphNode
    description: Kalbach-formulated desired outcome statement.
    slots:
    - statement
    - direction
    - unit_of_measure
    - qualifier
    - importance
    - satisfaction
    - opportunity_score
    - related_job
    - object_of_control
    slot_usage:
      id:
        pattern: ^jtbd:OUT-[A-Z0-9-]+$
      statement:
        required: true
      direction:
        required: true
      unit_of_measure:
        required: true
  InvestmentLane:
    is_a: GraphNode
    slots:
    - horizon
    - strategic_weight
    - product_outcomes
    - owner
    slot_usage:
      id:
        pattern: ^inv:LANE-[A-Z0-9-]+$
  ProductOutcome:
    is_a: GraphNode
    slots:
    - lane
    - informed_by_outcomes
    - target_metric
    - target_value
    - current_value
    - target_date
    slot_usage:
      id:
        pattern: ^inv:POUT-[A-Z0-9-]+$
      lane:
        required: true
  Requirement:
    is_a: GraphNode
    slots:
    - requirement_type
    - realizes_product_outcomes
    - satisfied_by_capabilities
    - priority
    - acceptance_criteria
    slot_usage:
      id:
        pattern: ^req:REQ-[A-Z0-9-]+$
      requirement_type:
        required: true
  Capability:
    is_a: GraphNode
    slots:
    - capability_type
    - satisfies_requirements
    - supports_jobs
    - supports_desired_outcomes
    - implementation_status
    - owner
    slot_usage:
      id:
        pattern: ^req:CAP-[A-Z0-9-]+$
