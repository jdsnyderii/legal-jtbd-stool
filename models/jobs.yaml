id: https://example.org/legal-jtbd/jobs
name: LegalJTBDJobs
title: Jobs to Be Done (Legal / Litigation)
version: 0.5.0
description: "Kalbach-style JTBD model with three levels of job granularity: - top_level   = Main Job\
  \ (stable, broad objective) - mid_level   = Job-map stage / major step (aligned to litigation phases)\
  \ - micro       = Micro-job (smallest actionable objective inside a stage) Anchored to coarse-grained\
  \ litigation phases and optionally to SALI LMSS tags.\n\n\n v0.5.0 adds Kalbach descriptive fields (statement\
  \ grammar, performer, circumstances, emotional/social, end_state, job story). Process remains hierarchical."
prefixes:
  linkml: https://w3id.org/linkml/
  jtbd: https://example.org/legal-jtbd/jobs/
  gf: https://example.org/legal-jtbd/graph-foundation/
  sali: https://sali.org/lmss/
default_prefix: jtbd
imports:
- linkml:types
- gf:graph_foundation
classes:
  Job:
    is_a: GraphNode
    description: 'A job to be done at one of three Kalbach-aligned levels: top_level (Main Job), mid_level
      (stage in the job map), or micro (micro-job inside a stage).

      '
    annotations:
      graph_role: node
    slots:
    - job_level
    - parent_job
    - phase
    - sali_tags
    - desired_outcomes
    - child_jobs
    - related_jobs
    - last_reviewed
    - sequence_order
    - iterative
    - job_statement
    - statement_verb
    - statement_object
    - statement_clarifier
    - job_performer
    - buyer_role
    - circumstance_situation
    - circumstance_constraints
    - emotional_job
    - social_job
    - end_state
    - job_story_situation
    - job_story_motivation
    - job_story_expected_outcome
    slot_usage:
      id:
        pattern: ^jtbd:JOB-[A-Z0-9-]+$
      job_level:
        required: true
  DesiredOutcome:
    is_a: GraphNode
    description: Kalbach-formulated desired outcome statement.
    annotations:
      graph_role: node
    slots:
    - statement
    - direction
    - unit_of_measure
    - qualifier
    - importance
    - satisfaction
    - opportunity_score
    - related_job
    - object_of_control
    slot_usage:
      id:
        pattern: ^jtbd:OUT-[A-Z0-9-]+$
      statement:
        required: true
      direction:
        required: true
      unit_of_measure:
        required: true
slots:
  job_level:
    range: JobLevel
    required: true
    description: 'top_level = Main Job; mid_level = stage / major step in the job map; micro = micro-job
      (finest grain inside a stage).

      '
  parent_job:
    range: Job
    annotations:
      graph_role: edge
    description: 'Hierarchical parent. A mid_level job points to a top_level job. A micro job points to
      a mid_level (or occasionally top_level) job.

      '
  child_jobs:
    range: Job
    multivalued: true
    annotations:
      graph_role: edge
    description: 'Convenience inverse of parent_job. Especially useful for listing the micro-jobs that
      belong to a mid_level stage.

      '
  phase:
    range: LitigationPhase
    description: Coarse-grained litigation phase this job primarily belongs to.
  sali_tags:
    range: uriorcurie
    multivalued: true
    annotations:
      graph_role: edge
    description: External SALI LMSS concept CURIEs (not in-schema classes). Stored as TEXT in SQL.
  desired_outcomes:
    range: DesiredOutcome
    multivalued: true
    annotations:
      graph_role: edge
  related_jobs:
    range: Job
    multivalued: true
    annotations:
      graph_role: edge
    description: Lateral (non-hierarchical) relationships between jobs.
  sequence_order:
    range: integer
    description: 'Optional ordering within a parent (especially useful for micro-jobs that form a sequence
      inside a mid_level stage).

      '
  iterative:
    range: boolean
    description: 'True when this mid-level job can legitimately repeat / loop during a matter (e.g. discovery
      waves, successive motions, negotiation rounds).

      '
  statement:
    range: string
    description: Full Kalbach statement.
  direction:
    range: OutcomeDirection
  unit_of_measure:
    range: string
  qualifier:
    range: string
  importance:
    range: integer
    minimum_value: 1
    maximum_value: 10
  satisfaction:
    range: integer
    minimum_value: 1
    maximum_value: 10
  opportunity_score:
    range: float
  related_job:
    range: Job
    annotations:
      graph_role: edge
  last_reviewed:
    range: date
  statement_verb:
    range: string
    description: 'Kalbach job statement: action verb (solution-agnostic).'
  statement_object:
    range: string
    description: 'Kalbach job statement: object of the verb.'
  statement_clarifier:
    range: string
    description: 'Kalbach job statement: optional contextual clarifier.'
  job_statement:
    range: string
    description: Assembled or free-text job statement (verb + object + clarifier).
  job_performer:
    range: string
    description: Who executes the job (end user / job performer).
  buyer_role:
    range: string
    description: Who buys or authorizes when different from the job performer.
  circumstance_situation:
    range: string
    description: Triggering situation / context in which the job arises.
  circumstance_constraints:
    range: string
    multivalued: true
    description: Constraints framing the job (time, budget, risk, forum, etc.).
  emotional_job:
    range: string
    description: How the performer wants to feel while or after doing the job.
  social_job:
    range: string
    description: How the performer wants to be perceived socially in relation to the job.
  end_state:
    range: string
    description: What 'done' looks like — clear completion criterion for the job.
  job_story_situation:
    range: string
    description: 'Job story: When [situation]…'
  job_story_motivation:
    range: string
    description: 'Job story: I want to [motivation]…'
  job_story_expected_outcome:
    range: string
    description: 'Job story: so I can [expected outcome].'
  object_of_control:
    range: string
    description: 'ODI/Kalbach desired outcome: object of control being improved.'
enums:
  JobLevel:
    permissible_values:
      top_level:
        description: Main Job — broad, stable objective the performer is trying to achieve.
      mid_level:
        description: Stage / major step in the job map (often aligned to a litigation phase).
      micro:
        description: Micro-job — smallest actionable objective inside a mid_level stage.
  LitigationPhase:
    permissible_values:
      pre_litigation: Pre-litigation / Investigation & Assessment
      pleadings: Pleadings / Case Initiation
      discovery: Discovery
      pretrial: Pretrial / Motions & Case Management
      trial: Trial / Hearing
      post_trial: Post-trial / Appeal / Enforcement
      resolution: Resolution / Settlement / Closure
      cross_cutting: Cross-cutting (applies to multiple phases)
  OutcomeDirection:
    permissible_values:
      minimize: null
      maximize: null
      increase: null
      decrease: null
      reduce: null
      raise: null
